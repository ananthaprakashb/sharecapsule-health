name: Package Chrome Extension

on:
  pull_request:
    paths:
      - 'chrome-extension/**'
      - '.github/workflows/chrome-extension.yml'
  push:
    branches: [main]
    paths:
      - 'chrome-extension/**'
      - '.github/workflows/chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          node - <<'NODE'
          const m = require('./chrome-extension/manifest.json')
          if (m.manifest_version !== 3) throw new Error('Manifest V3 required')
          if (m.version !== '1.1.1') throw new Error('Expected extension version 1.1.1')
          if (m.permissions?.length) throw new Error('Compact widget should not request permissions')
          if (m.background) throw new Error('Compact widget should not use a background launcher')
          if (m.action?.default_popup !== 'popup.html') throw new Error('Expected popup.html as action popup')
          NODE

      - name: Validate popup files
        run: |
          test -f chrome-extension/popup.html
          test -f chrome-extension/popup.css
          test -f chrome-extension/popup.js
          grep -q "health.sharecapsule.org" chrome-extension/popup.html

      - name: Package extension
        run: |
          cd chrome-extension
          zip -r ../thirumoolar-pranayama-extension-v1.1.1.zip manifest.json popup.html popup.css popup.js icons

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: thirumoolar-pranayama-extension-v1.1.1
          path: thirumoolar-pranayama-extension-v1.1.1.zip
          if-no-files-found: error
