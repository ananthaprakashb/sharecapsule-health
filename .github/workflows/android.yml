name: Android CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'scripts/android/**'
      - 'mobile/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare Capacitor Android project
        run: npm run android:prepare

      - name: Verify Android release metadata
        run: |
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q 'applicationId "org.sharecapsule.vital"' android/app/build.gradle
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release app bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vital-android-validation
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
