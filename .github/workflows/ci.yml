name: PWA CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BUILD: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify PWA output
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -q "assets/" dist/sw.js
          grep -q "512x512" dist/manifest.webmanifest
